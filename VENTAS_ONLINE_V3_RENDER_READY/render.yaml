services:
  - type: web
    name: ventas-online-telegram-monitor
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    plan: free
    autoDeploy: true
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: SESSION_STRING
        sync: false
      - key: DESTINATION_TARGET
        value: "-1004347839377"
      - key: USER_TO_MENTION
        value: "@mrcodexofc"
      - key: ADMIN_MENTIONS
        value: "@mrcodexofc"
      - key: MIN_SCORE
        value: "60"
      - key: HIGH_SCORE
        value: "85"
      - key: VIP_SCORE
        value: "95"
      - key: MIN_COMMERCIAL_SCORE
        value: "28"
      - key: MIN_WORDS
        value: "2"
      - key: MIN_CHARACTERS
        value: "8"
      - key: COOLDOWN_SECONDS
        value: "300"
      - key: GROUPING_WINDOW_SECONDS
        value: "0"
      - key: ENABLE_HISTORY
        value: "true"
      - key: ENABLE_TRENDS
        value: "true"
      - key: ENABLE_ANTISPAM
        value: "true"
      - key: SALES_ONLY_MODE
        value: "true"
      - key: BUYERS_ONLY_MODE
        value: "true"
